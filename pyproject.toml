[project]
# "tablewatch" over the metaphor names (assay, litmus, touchstone) because
# it states the product in one read: the unit a data quality check runs
# against is a table. The metaphors were all squatted on PyPI anyway.
# "datawatch" was the first choice and was dropped — DATAWATCH is a live
# Altair trademark for data-prep software, the same goods class as this.
name = "tablewatch"
version = "0.1.0"
description = "Data quality checks for your tables: assert, monitor, and alert on the state of your data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Geoffrey Koh" }]
requires-python = ">=3.13"
keywords = ["data-quality", "data-validation", "monitoring", "testing", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "alembic>=1.13",
    "click>=8.1",
    "pydantic>=2.0",
    "ruamel-yaml>=0.18",
    "sqlalchemy>=2.0",
]

[project.urls]
Repository = "https://github.com/geoffkoh/tablewatch"

[project.scripts]
tablewatch = "tablewatch.cli.main:cli"
# Short alias: this is the command typed daily, and c4studio's `c4` set the
# precedent. Both entry points target the same group.
tw = "tablewatch.cli.main:cli"

[project.optional-dependencies]
duckdb = [
    "duckdb>=1.1",
    "duckdb-engine>=0.13",
]
postgres = [
    "psycopg[binary]>=3.2",
]
# `tablewatch serve`. Plain packages, not the [standard] variants: those add
# uvloop, httptools, watchfiles, websockets and more that the API never uses.
# starlette and h11 are transitive; their floors are security fixes
# (CVE-2025-62727, CVE-2025-43859).
server = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "starlette>=0.49.1",
    "h11>=0.16",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tablewatch"

[tool.ruff.lint]
# Stated outright rather than inherited from ruff's defaults, so that a
# ruff upgrade is an upgrade and not a silent change of contract. This set
# is the one c4studio arrived at after adopting 0.16's findings family by
# family; it starts here already chosen rather than being re-derived.
select = [
    # ruff 0.15's default selection, written down.
    "E4", "E7", "E9", "F",
    # Import ordering: stdlib / third-party / local.
    "I",
    # Modern syntax on a codebase that requires 3.13 (`X | None` etc).
    "UP",
    # flake8-bugbear.
    "B",
    # Small, real cleanups: collapsible ifs, manual comprehensions,
    # os.path calls with a pathlib equivalent, naming slips.
    "SIM", "FURB", "ISC", "PERF", "N", "PTH",
    # Catches `subprocess.run` with no `check=`, among others.
    "PLW",
    # Guard rails that cost nothing on a new codebase: dead comprehension
    # work, real errors, unreachable `else` after `return`.
    "C4", "PLE", "RET",
    # Two specific RUF rules rather than all of it — RUF001/RUF002 would
    # flag em dashes used deliberately in prose.
    "RUF015", "RUF022",
]

[tool.ruff.format]
# Prose snippets in Markdown are written to be read, not to satisfy a
# formatter. Formatting stays on real source files.
exclude = ["*.md"]

[tool.mypy]
# Strict by default, so that `uv run mypy .` is the strict one and
# strictness cannot regress unnoticed.
strict = true
# npm packages can ship .py files under frontend/node_modules.
exclude = ["^frontend/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warnings fail the suite: an unclosed connection or a deprecated call is
# caught the day it is introduced, not when it becomes an outage.
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # The project's own gate tools are project dependencies: left
    # undeclared, `uv run mypy` / `uv run ruff` resolve to an ephemeral
    # install that drifts per machine and is absent in CI.
    "mypy>=1.11",
    "ruff>=0.15.22,<0.17",
    "duckdb>=1.1",
    "duckdb-engine>=0.13",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "starlette>=0.49.1",
    "h11>=0.16",
    "httpx2>=2.13,<3",
]
